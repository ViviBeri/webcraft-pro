name: Accessibility Keyboard Tests

on:
  push:
    branches:
      - main
    paths:
      - "examples/accessibility/fixture/**"
      - "tests/accessibility/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/accessibility-check.yml"
      - "stages/05-accessibility/README.md"
  pull_request:
    branches:
      - main
    paths:
      - "examples/accessibility/fixture/**"
      - "tests/accessibility/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/accessibility-check.yml"
      - "stages/05-accessibility/README.md"

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyboard-tests:
    name: Chromium keyboard and focus tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install development dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run keyboard and focus tests
        run: npm run test:accessibility
