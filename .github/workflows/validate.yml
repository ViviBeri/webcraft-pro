name: Validate Repository

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills and Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test skill validator
        run: npm run test:validate

      - name: Test Skill Doctor
        run: npm run test:skill-doctor

      - name: Run Skill Doctor (strict)
        run: npm run validate:skill-doctor

      - name: Validate skill metadata and stage structure
        run: npm run validate

      - name: Test skill-count consistency
        run: npm run test:consistency

      - name: Validate public skill-count claims
        run: npm run validate:consistency

      - name: Validate skill catalog index
        run: npm run validate:skill-count

      - name: Test version synchronization
        run: npm run test:version-sync

      - name: Validate version synchronization
        run: npm run validate:version-sync

      - name: Test Markdown link checker
        run: npm run test:links

      - name: Validate internal Markdown links
        run: npm run validate:links

      - name: Validate stage skill coverage
        run: npm run validate:stage-coverage

      - name: Test stage skill coverage
        run: npm run test:stage-coverage

      - name: Validate routing evaluation corpus
        run: npm run validate:evals

      - name: Test skill installer
        run: npm run test:installer
