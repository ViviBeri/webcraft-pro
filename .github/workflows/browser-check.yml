name: Manual Browser Check

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Optional HTTP(S) or local file URL; defaults to the local test fixture"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  browser-check:
    name: Run Chromium browser checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install development dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser checker
        run: npm run browser:check -- --url "${{ inputs.target_url || format('file://{0}/examples/test-page.html', github.workspace) }}" --output-dir browser-check-artifacts

      - name: Upload browser check report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-check-artifacts
          path: browser-check-artifacts/
          if-no-files-found: warn
          retention-days: 14
