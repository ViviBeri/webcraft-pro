<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">webcraft — build. craft. ship.</title>
  <desc id="desc">A premium glassmorphism developer workspace floating over an animated indigo, violet and cyan aurora.</desc>
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d20"><animate attributeName="stop-color" values="#080d20;#171039;#081b31;#080d20" dur="18s" repeatCount="indefinite"/></stop>
      <stop offset=".52" stop-color="#30206d"><animate attributeName="stop-color" values="#30206d;#123b66;#512184;#30206d" dur="21s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#071c35"><animate attributeName="stop-color" values="#071c35;#14205c;#063d49;#071c35" dur="19s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="violetGlow"><stop stop-color="#8a58ff" stop-opacity=".62"/><stop offset="1" stop-color="#8a58ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyanGlow"><stop stop-color="#00d9f5" stop-opacity=".48"/><stop offset="1" stop-color="#00d9f5" stop-opacity="0"/></radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff"/><stop offset=".56" stop-color="#dceaff"/><stop offset="1" stop-color="#75eaff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".19"/><stop offset=".48" stop-color="#a9c2ff" stop-opacity=".055"/><stop offset="1" stop-color="#fff" stop-opacity=".105"/></linearGradient>
    <linearGradient id="browserFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182541" stop-opacity=".94"/><stop offset="1" stop-color="#091224" stop-opacity=".88"/></linearGradient>
    <linearGradient id="sweep"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="ambientBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="glassShadow" x="-30%" y="-35%" width="170%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/><feOffset in="blur" dx="0" dy="15" result="offset"/><feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.01 0 0 0 0 0.02 0 0 0 0 0.08 0 0 0 .55 0" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="toastShadow" x="-40%" y="-50%" width="190%" height="210%"><feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/><feOffset dy="8" result="offset"/><feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope=".48"/></feComponentTransfer><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cyanBloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="bloom"/><feMerge><feMergeNode in="bloom"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="filmGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="17"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer></filter>
    <clipPath id="browserClip"><rect x="660" y="55" width="555" height="292" rx="20"/></clipPath>
    <clipPath id="sweepClip"><rect x="660" y="55" width="555" height="292" rx="20"/></clipPath>
  </defs>
  <rect width="1280" height="400" fill="url(#aurora)"/>
  <ellipse cx="300" cy="320" rx="390" ry="230" fill="url(#violetGlow)" filter="url(#ambientBlur)"><animate attributeName="cx" values="300;470;300" dur="20s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="1080" cy="90" rx="350" ry="270" fill="url(#cyanGlow)" filter="url(#ambientBlur)"><animate attributeName="cy" values="90;255;90" dur="17s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="760" cy="410" rx="340" ry="130" fill="url(#violetGlow)" filter="url(#ambientBlur)" opacity=".65"/>
  <g stroke="#dceaff" stroke-opacity=".035" stroke-width="1"><path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280"/><path d="M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/></g>
  <rect width="1280" height="400" filter="url(#filmGrain)" opacity=".25"/>
  <g transform="translate(84 174)">
    <text x="0" y="0" fill="url(#wordmark)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="78" font-weight="760" letter-spacing="-5.2">webcraft</text>
    <text x="4" y="43" fill="#d9e5ff" fill-opacity=".84" font-family="Inter, ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif" font-size="17" font-weight="450" letter-spacing="5.2">BUILD. CRAFT. SHIP.</text>
    <rect x="4" y="68" width="72" height="2.5" rx="1.25" fill="#63e8ff"><animate attributeName="width" values="72;116;72" dur="5s" repeatCount="indefinite"/></rect>
    <text x="4" y="101" fill="#c4d1ed" fill-opacity=".62" font-family="Inter, ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="2.2">DESIGN ENGINEERING · DIGITAL CRAFT</text>
  </g>
  <g filter="url(#glassShadow)"><rect x="694" y="76" width="540" height="260" rx="22" fill="url(#glass)" stroke="#fff" stroke-opacity=".22" stroke-width="1" transform="rotate(-4 964 206)"><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="8s" repeatCount="indefinite" additive="sum"/></rect></g>
  <g filter="url(#glassShadow)">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="7s" repeatCount="indefinite"/>
      <rect x="660" y="55" width="555" height="292" rx="20" fill="url(#browserFill)" stroke="#fff" stroke-opacity=".48" stroke-width="1.2"/>
      <g clip-path="url(#browserClip)">
        <rect x="660" y="55" width="555" height="53" fill="#fff" fill-opacity=".075"/><path d="M660 108H1215" stroke="#fff" stroke-opacity=".19"/>
        <circle cx="687" cy="82" r="5.5" fill="#ff687c"/><circle cx="707" cy="82" r="5.5" fill="#ffc65e"/><circle cx="727" cy="82" r="5.5" fill="#48dba0"/>
        <rect x="830" y="69" width="220" height="26" rx="8" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".07"/>
        <text x="940" y="86" text-anchor="middle" fill="#d4e0f7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing=".6">webcraft.dev</text>
        <rect x="660" y="108" width="94" height="239" fill="#070d1b" fill-opacity=".48"/><path d="M754 108V347" stroke="#fff" stroke-opacity=".11"/>
        <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#8fa2c5"><text x="676" y="134" fill="#b2c2e1" letter-spacing="1">EXPLORER</text><text x="680" y="162">⌄  src</text><text x="692" y="184" fill="#a9c9ff">index.ts</text><text x="692" y="205">app.tsx</text><text x="680" y="232">⌄  public</text><text x="692" y="254">assets</text><text x="680" y="281">⌄  config</text><text x="692" y="303">vite.ts</text></g>
        <circle cx="674" cy="159" r="2" fill="#69ddff"/><circle cx="674" cy="181" r="2" fill="#b49aff"/>
        <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.2">
          <text x="777" y="139" fill="#7489ad">// create something exceptional</text><text x="777" y="170" fill="#c792ea">const</text><text x="817" y="170" fill="#e6edff"> webcraft = {</text>
          <text x="797" y="198" fill="#89ddff">design:</text><text x="866" y="198" fill="#c3e88d"> 'beautiful',</text><text x="797" y="226" fill="#89ddff">experience:</text><text x="900" y="226" fill="#c3e88d"> 'seamless',</text>
          <text x="797" y="254" fill="#89ddff">performance:</text><text x="909" y="254" fill="#f6bd65"> '100',</text><text x="777" y="282" fill="#e6edff">};</text>
          <text x="777" y="317" fill="#c792ea">await</text><text x="824" y="317" fill="#82aaff"> webcraft.ship()</text><text x="951" y="317" fill="#89ddff">;</text>
        </g>
        <rect x="770" y="294" width="330" height="32" rx="5" fill="#fff" fill-opacity=".035"/>
      </g><path d="M681 56H1194" stroke="#fff" stroke-opacity=".52"/>
    </g>
  </g>
  <g filter="url(#toastShadow)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="6s" repeatCount="indefinite"/>
    <rect x="1000" y="137" width="222" height="70" rx="14" fill="#17243d" fill-opacity=".91" stroke="#fff" stroke-opacity=".54" stroke-width="1"/>
    <circle cx="1028" cy="172" r="13" fill="#20ddb4" fill-opacity=".16" stroke="#45efd0" stroke-opacity=".9"/><path d="M1022 172l4 4 8-9" fill="none" stroke="#61f5d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanBloom)"/>
    <text x="1051" y="168" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="11.5" font-weight="650">Deployment ready</text><text x="1051" y="185" fill="#a9bbda" font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="9.5">Your build is live.</text>
  </g></g>
  <g filter="url(#cyanBloom)"><animateTransform attributeName="transform" type="translate" values="0 0;-5 -7;0 0" dur="4.5s" repeatCount="indefinite"/><circle cx="1170" cy="270" r="25" fill="#00d9ff" fill-opacity=".11" stroke="#66eaff" stroke-opacity=".16"/><path d="M1161 252l22 22-10 1-4 11z" fill="#f7fdff" stroke="#5deaff" stroke-width="1.5" stroke-linejoin="round"/></g>
  <g clip-path="url(#sweepClip)" opacity=".58"><rect x="-90" y="40" width="82" height="320" fill="url(#sweep)" transform="rotate(17)"><animate attributeName="x" values="-160;1330;-160" dur="8s" repeatCount="indefinite"/></rect></g>
  <path d="M0 399H1280" stroke="#fff" stroke-opacity=".13"/>
</svg>